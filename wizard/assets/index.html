<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TWP-CF Deployer</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --muted: #8b929e;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
    }
    main { width: 100%; max-width: 440px; }
    h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 0.25rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; }
    input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: var(--mono);
      margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    input::placeholder { color: #4b5260; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .log {
      margin-top: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .log.visible { display: block; }
    .log .info { color: var(--muted); }
    .log .error { color: var(--error); }
    .result, .history {
      margin-top: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .result { display: none; }
    .result.visible { display: block; }
    .result h2, .history h2 {
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }
    .result h2 { color: var(--success); }
    .history h2 {
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history h2 button {
      width: auto;
      padding: 0.25rem 0.55rem;
      font-size: 0.75rem;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .history h2 button:hover { color: var(--error); border-color: var(--error); }
    .history:empty, .history.hidden { display: none; }
    .row { margin-bottom: 0.75rem; }
    .row:last-child { margin-bottom: 0; }
    .row label { margin-bottom: 0.25rem; }
    .value { display: flex; gap: 0.5rem; align-items: center; }
    .value code {
      flex: 1;
      background: var(--bg);
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.78rem;
      word-break: break-all;
    }
    .copy, .del {
      flex-shrink: 0;
      width: auto;
      padding: 0.45rem 0.65rem;
      font-size: 0.78rem;
      background: var(--border);
    }
    .copy:hover, .del:hover { background: #3a4050; }
    .del { color: var(--muted); }
    .item {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      margin-top: 0.75rem;
    }
    .item:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
    .item .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>TWP-CF Deployer</h1>
    <p class="sub">دیپلوی خودکار پروکسی تلگرام روی Cloudflare Workers</p>

    <form id="form">
      <label for="token">Cloudflare API Token</label>
      <input id="token" type="password" placeholder="پیست کنید..." required autocomplete="off" spellcheck="false">

      <label for="name">نام Worker (اختیاری)</label>
      <input id="name" type="text" placeholder="خالی = تصادفی" pattern="[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?" autocomplete="off">

      <button type="submit" id="btn">دیپلوی</button>
    </form>

    <div class="log" id="log"></div>

    <div class="result" id="result">
      <h2>دیپلوی موفق</h2>
      <div class="row">
        <label>آدرس پروکسی</label>
        <div class="value">
          <code id="out-url"></code>
          <button type="button" class="copy" data-copy="out-url">کپی</button>
        </div>
      </div>
      <div class="row">
        <label>PROXY_SECRET</label>
        <div class="value">
          <code id="out-secret"></code>
          <button type="button" class="copy" data-copy="out-secret">کپی</button>
        </div>
      </div>
      <div class="row">
        <label>لینک تلگرام</label>
        <div class="value">
          <code id="out-tg"></code>
          <button type="button" class="copy" data-copy="out-tg">کپی</button>
        </div>
      </div>
    </div>

    <div class="history" id="history"></div>

    <p class="hint">
      Token با دسترسی‌های لازم از قبل تنظیم شده:
      <a href="https://dash.cloudflare.com/profile/api-tokens?permissionGroupKeys=%5B%7B%22key%22%3A%22workers_scripts%22%2C%22type%22%3A%22edit%22%7D%2C%7B%22key%22%3A%22user_details%22%2C%22type%22%3A%22read%22%7D%5D&accountId=%2A&zoneId=all&name=TWP-CF-Deployer" target="_blank" rel="noopener">ساخت Token</a>
      → Continue to summary → Create Token
    </p>
  </main>

  <script>
    const STORAGE_KEY = "twp-cf-deploys";
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const logEl = document.getElementById("log");
    const resultEl = document.getElementById("result");
    const historyEl = document.getElementById("history");

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveHistory(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, 30)));
    }

    function tgLink(url, secret) {
      try {
        const host = new URL(url).hostname;
        return `https://t.me/webproxy?server=${encodeURIComponent(host)}&secret=${encodeURIComponent(secret)}`;
      } catch {
        return "";
      }
    }

    function fmtTime(ts) {
      try {
        return new Date(ts).toLocaleString("fa-IR", { dateStyle: "short", timeStyle: "short" });
      } catch {
        return "";
      }
    }

    function renderHistory() {
      const list = loadHistory();
      if (!list.length) {
        historyEl.classList.add("hidden");
        historyEl.innerHTML = "";
        return;
      }
      historyEl.classList.remove("hidden");
      historyEl.innerHTML =
        `<h2><span>دیپلوی‌های ذخیره‌شده</span><button type="button" id="clear-all">پاک کردن همه</button></h2>` +
        list.map((d, i) => `
          <div class="item" data-i="${i}">
            <div class="meta"><span>${d.workerName || "—"}</span><span>${fmtTime(d.at)}</span></div>
            <div class="row">
              <label>آدرس</label>
              <div class="value">
                <code>${escapeHtml(d.url)}</code>
                <button type="button" class="copy" data-text="${escapeAttr(d.url)}">کپی</button>
              </div>
            </div>
            <div class="row">
              <label>Secret</label>
              <div class="value">
                <code>${escapeHtml(d.secret)}</code>
                <button type="button" class="copy" data-text="${escapeAttr(d.secret)}">کپی</button>
              </div>
            </div>
            <div class="row">
              <label>تلگرام</label>
              <div class="value">
                <code>${escapeHtml(d.tg)}</code>
                <button type="button" class="copy" data-text="${escapeAttr(d.tg)}">کپی</button>
                <button type="button" class="del" data-i="${i}">حذف</button>
              </div>
            </div>
          </div>
        `).join("");

      document.getElementById("clear-all")?.addEventListener("click", () => {
        if (confirm("همه دیپلوی‌های ذخیره‌شده پاک شوند؟")) {
          localStorage.removeItem(STORAGE_KEY);
          renderHistory();
        }
      });
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, "&#39;");
    }

    function addDeploy(entry) {
      const list = loadHistory().filter((d) => d.url !== entry.url);
      list.unshift(entry);
      saveHistory(list);
      renderHistory();
    }

    function log(type, msg) {
      logEl.classList.add("visible");
      const line = document.createElement("div");
      line.className = type;
      line.textContent = msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function copyText(text, button) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        const old = button.textContent;
        button.textContent = "کپی شد";
        setTimeout(() => (button.textContent = old), 900);
      }).catch(() => {});
    }

    document.addEventListener("click", (e) => {
      const t = e.target;
      if (t.matches(".copy[data-copy]")) {
        const el = document.getElementById(t.dataset.copy);
        copyText(el?.textContent || "", t);
      } else if (t.matches(".copy[data-text]")) {
        copyText(t.dataset.text, t);
      } else if (t.matches(".del[data-i]")) {
        const list = loadHistory();
        list.splice(Number(t.dataset.i), 1);
        saveHistory(list);
        renderHistory();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      logEl.innerHTML = "";
      logEl.classList.remove("visible");
      resultEl.classList.remove("visible");

      try {
        const res = await fetch("/api/deploy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: document.getElementById("token").value.trim(),
            name: document.getElementById("name").value.trim(),
          }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            let msg;
            try { msg = JSON.parse(line); } catch { continue; }
            if (msg.type === "info") log("info", msg.message);
            else if (msg.type === "error") log("error", msg.message);
            else if (msg.type === "complete") {
              const tg = tgLink(msg.url, msg.secret);
              document.getElementById("out-url").textContent = msg.url;
              document.getElementById("out-secret").textContent = msg.secret;
              document.getElementById("out-tg").textContent = tg;
              resultEl.classList.add("visible");
              log("info", "تمام.");
              addDeploy({
                url: msg.url,
                secret: msg.secret,
                workerName: msg.workerName || "",
                tg,
                at: Date.now(),
              });
            }
          }
        }
      } catch (err) {
        log("error", err.message || String(err));
      } finally {
        btn.disabled = false;
      }
    });

    renderHistory();
  </script>
</body>
</html>
